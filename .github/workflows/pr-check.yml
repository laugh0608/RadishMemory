name: PR Checks

on:
  pull_request:
    branches:
      - dev
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repo-hygiene:
    name: Repo Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Check repository baseline
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -n "${BASE_SHA}" ]]; then
            python scripts/check-repo.py --base-ref "${BASE_SHA}"
          else
            python scripts/check-repo.py
          fi

  rust-quality:
    name: Rust Quality (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-latest
          - platform: macOS
            os: macos-latest
          - platform: Windows
            os: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt

      - name: Check Rust formatting
        shell: bash
        run: cargo fmt --all --check

      - name: Lint Rust workspace
        shell: bash
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test Rust workspace
        shell: bash
        run: cargo test --workspace --all-targets --all-features --locked

  candidate-quality:
    name: Candidate Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always()
    needs:
      - repo-hygiene
      - rust-quality

    steps:
      - name: Summarize candidate quality
        shell: bash
        env:
          REPO_HYGIENE_RESULT: ${{ needs.repo-hygiene.result }}
          RUST_QUALITY_RESULT: ${{ needs.rust-quality.result }}
        run: |
          {
            echo "## Candidate Quality"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Repo Hygiene | ${REPO_HYGIENE_RESULT} |"
            echo "| Rust Quality (Linux, macOS, Windows) | ${RUST_QUALITY_RESULT} |"
          } >> "${GITHUB_STEP_SUMMARY}"

          if [[ "${REPO_HYGIENE_RESULT}" != "success" || "${RUST_QUALITY_RESULT}" != "success" ]]; then
            echo "One or more candidate quality components did not succeed." >&2
            exit 1
          fi

          echo "All candidate quality components succeeded."
